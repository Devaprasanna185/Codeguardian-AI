services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      # reach Ollama running on the host machine
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports:
      - "80:80"
